name: CI
# SRS §16: CI runs lint and tests on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint          # ESLint + the raw-colour check (THM-05, scenario 18)
      - run: npx nuxt typecheck
      - run: npx vitest run
      - run: npm run build
